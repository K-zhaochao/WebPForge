name: Build macOS Intel (manual)

# Standalone fallback build. Tagged releases include Intel automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    name: 打包 macOS-Intel
    runs-on: macos-15-intel
    timeout-minutes: 45      # 排队超过 45 分钟直接放弃, 不无限占用

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 tkinter
        run: |
          brew install python-tk@3.12 || brew install python-tk || true
          python3 -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: 打包
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: 校验 .app 结构
        run: |
          test -x "dist/WebPForge.app/Contents/MacOS/WebPForge" \
            || { echo "!! .app 结构不完整"; exit 1; }
          lipo -archs "dist/WebPForge.app/Contents/MacOS/WebPForge" || true
          echo "ok: dist/WebPForge.app"

      - name: 打成 zip
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          VERSION="${VERSION#v}"
          mkdir -p out stage
          cp -R dist/WebPForge.app stage/
          for f in README.md README.en.md LICENSE; do
            [ -f "$f" ] && cp "$f" stage/ || true
          done
          # .app 必须先压缩再上传, 否则上传时会被展开, 外层 .app 名字丢失
          (cd stage && zip -r -q --symlinks "../out/WebPForge-${VERSION}-macOS-Intel.zip" .)
          ls -lh out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: WebPForge-macOS-Intel
          path: out/*.zip
          if-no-files-found: error
