name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows-x64, os: windows-latest, kind: windows}
          - {name: macOS-ARM64, os: macos-14, kind: macos}
          - {name: macOS-Intel, os: macos-15-intel, kind: macos}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import os,webp_converter; assert os.environ['GITHUB_REF_NAME'] == 'v'+webp_converter.APP_VERSION"
      - name: Install dependencies
        run: python -m pip install pillow pyinstaller
      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: .\build_windows.ps1 -SkipZip
      - name: Verify Windows executable
        if: matrix.kind == 'windows'
        run: python -X utf8 tools/test_packaged.py dist/WebPForge.exe
      - name: Upload Windows executable
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: WebPForge-${{ matrix.name }}
          path: |
            dist/WebPForge.exe
            README.md
            README.en.md
            LICENSE
          if-no-files-found: error
      - name: Package macOS
        if: matrix.kind == 'macos'
        shell: bash
        env:
          WEBPFORGE_PYTHON: python
        run: |
          python -c "import tkinter; print(tkinter.TkVersion)"
          bash build_macos.sh
          test -x dist/WebPForge.app/Contents/MacOS/WebPForge
          lipo -archs dist/WebPForge.app/Contents/MacOS/WebPForge
          mkdir -p dist-artifact
          ditto -c -k --sequesterRsrc --keepParent dist/WebPForge.app dist-artifact/WebPForge.app.zip
      - name: Upload macOS application
        if: matrix.kind == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: WebPForge-${{ matrix.name }}
          path: |
            dist-artifact/WebPForge.app.zip
            README.md
            README.en.md
            LICENSE
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Test website and deployment contract
        run: |
          node --test tests/site-*.test.mjs
          python -m unittest discover -s tests -p test_site.py -v
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          command -v zip || (sudo apt-get update -qq && sudo apt-get install -y zip)
          bash tools/package_release.sh artifacts out "${GITHUB_REF_NAME#v}"
          test -f "out/WebPForge-${GITHUB_REF_NAME#v}-macOS-Intel.zip"
          python tools/package_web.py out "$GITHUB_REF_NAME"
          sed -e "s|@@TAG@@|${GITHUB_REF_NAME}|g" -e "s|@@VERSION@@|${GITHUB_REF_NAME#v}|g" .github/RELEASE_BODY.md > RELEASE_BODY.md
      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          name: WebPForge ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            out/*.zip
            out/SHA256SUMS.txt
            out/release-manifest.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
